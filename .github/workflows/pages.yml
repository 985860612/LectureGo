name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/support
          cp docs/index.html docs/styles.css _site/
          cp docs/robots.txt docs/sitemap.xml _site/
          cp docs/app-*.webp _site/
          cp Resources/LectureGoMark.svg _site/lecturego-mark.svg
          cp Resources/Support/*.jpg _site/support/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
