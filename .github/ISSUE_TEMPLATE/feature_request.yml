name: 功能建议
description: 提议适用于非商业用途的新能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请先说明要解决的问题，不要只描述一个按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: 使用确认
      options:
        - label: 该需求面向许可证允许的非商业用途。
          required: true
